[project]
name = "piper-ws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pip>=25.3",
    "lerobot",
    "piper-lerobot",
    "piper-sdk==0.6.0", # 从 PyPI 安装
]

[tool.uv]
package = false # 声明根项目不是一个可分发的包

[tool.uv.workspace]
members = [
    "piper_lerobot",
    "lerobot",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
lerobot = { workspace = true, editable = true }
piper-lerobot = { workspace = true, editable = true }

[tool.uv.pip]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
extra-index-url = ["https://pypi.tuna.tsinghua.edu.cn/simple/"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
